name: Test impact

on:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test-impact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build inert change metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-status -z "$BASE_SHA" "$HEAD_SHA" -- > /tmp/test-impact-names

      - name: Analyze test impact
        run: python test_impact.py --names /tmp/test-impact-names --root .

      - name: Run analyzer tests
        run: python -m unittest -v test_test_impact.py
