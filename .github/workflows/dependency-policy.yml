name: Dependency policy

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build inert tracked-path input
        run: git ls-files -z > /tmp/dependency-paths

      - name: Check dependency policy
        run: python dependency_guard.py --root . --paths /tmp/dependency-paths --strict

      - name: Run dependency guard tests
        run: python -m unittest -v test_dependency_guard.py
